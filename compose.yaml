x-app: &app
  build: .
  environment: &env
    DATABASE_URL: postgresql+psycopg://study:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/study
    APP_TOKEN: ${APP_TOKEN:?Set APP_TOKEN}
    UPLOAD_DIR: /data/uploads
    AI_MODE: ${AI_MODE:-mock}
    AI_BASE_URL: ${AI_BASE_URL:-}
    AI_API_KEY: ${AI_API_KEY:-}
    AI_MODEL: ${AI_MODEL:-}
    AI_VISION_ENABLED: ${AI_VISION_ENABLED:-false}
  volumes:
    - attachments:/data/uploads
  restart: unless-stopped
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: study
      POSTGRES_DB: study
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study -d study"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  init:
    <<: *app
    command: ["python", "-c", "from app.models import init_db; init_db()"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *app
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${APP_PORT:-9010}:8080"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 20s
      timeout: 5s
      retries: 3
  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    depends_on:
      init:
        condition: service_completed_successfully
volumes:
  database:
  attachments:
